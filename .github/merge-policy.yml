# Which PRs an agent may land without the owner (graduated merge autonomy,
# Phase 1). The lander reads this file from the PR's base branch, never its
# head, and hands it to workflow-skills' scripts/merge-tier.py, which fails
# closed to `human` on anything outside the YAML subset it parses: flat
# `key: value`, `key: [a, b]`, and `key:` followed by `  - item` lines.
# `always_human` is checked before `auto`, and a path matching neither is
# human.

# Tests, and the hook and script programs they cover. A broken-link fix has no
# path of its own: links live in markdown, and every markdown file is human
# below, so a link fix lands with the owner like any other rule-file edit.
auto:
  - "*.test.sh"
  - "*.test.py"
  - hooks/*.py
  - hooks/*.sh
  - scripts/*.py

always_human:
  # Every rule file, skill description, agent definition, and plan, design or
  # decision doc. `**/*.md` also catches a rule file added in a new place.
  - "**/*.md"
  - skills/**
  - agents/**
  - dev_docs/**
  # What every session is handed, and how: the SessionStart carrier, the hook
  # wiring for both harnesses, and the plugin metadata.
  - inject.sh
  - hooks/hooks.json
  - codex/**
  - plugin.json
  - .claude-plugin/**
  # The gate `auto` relies on: a PR that edits these could make "checks green"
  # vacuous. The policy file itself is under .github/**.
  - .github/**
  - .github/merge-policy.yml
  - scripts/run-tests.sh
  - scripts/test_prelude.sh
  - ruff.toml
  - dprint.json

size_cap: 300

allowed_types: [feat, fix, perf, refactor, test, chore, ci, build, style]
