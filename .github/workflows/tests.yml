name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suites
        run: scripts/run-tests.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The three PreToolUse hooks run a python program each, and a syntax error
      # in one is a hook that says nothing on every payload and still exits 0.
      # Nothing could open those programs while they were `python3 -c`
      # arguments; ruff.toml pins which rules this runs.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Discovered, not enumerated, so the step's name stays true: a hand-kept
      # list drops a new shell file silently, which is a green run that checked
      # less than it did yesterday. `git ls-files` is the same discovery
      # scripts/run-tests.sh already uses to find suites.
      #
      # `-z` / `-0` because the alternative degrades the same way the hand-kept
      # list did: without it `git ls-files` C-quotes a path holding a space and
      # `xargs` splits it, so the step checks paths that do not exist instead of
      # the file it was meant to read. No such path exists here today; the point
      # is that discovery should not acquire a new silent gap while closing one.
      - name: shellcheck every shell file
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
